---
---
<!doctype html>
<html lang="{{ site.lang | default: 'en-GB' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="{{ site.description | escape }}">
  <title>{{ site.title | escape }}</title>
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>
  <header class="site-header">
    <div class="container">
      <h1 class="site-title">{{ site.title | escape }}</h1>
    </div>
  </header>
  <main class="container site-content" id="main-content">
    {% if site.profile_photo != "" %}
    <img class="profile-photo" src="{{ site.profile_photo | relative_url }}" alt="Portrait of Ipek Mumcu" width="164" height="200">
    {% endif %}
    {{ content }}
  </main>
</body>
</html>
